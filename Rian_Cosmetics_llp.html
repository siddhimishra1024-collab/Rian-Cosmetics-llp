        body {

        .form-header-block {

            padding-bottom: 30px;

        }

        .company-title h1 {

            font-weight: 700;
            color: #0f172a;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }

            color: #64748b;

        }

            color: #0f172a;

            border-radius: 12px;

            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        /* ==========================================================================
           PREMIUM FIELDS & INPUT FOCUS GLOW
           ========================================================================== */
        .form-row {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
            color: #334155;
            letter-spacing: 0.3px;
        }

        /* Sleek interactive entry fields */
        input[type="text"], 
        input[type="email"], 
        input[type="tel"], 
        input[type="date"], 
        textarea {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            font-family: inherit;
            color: #0f172a;
            border: 1px solid #d8e2ef;
            border-radius: 10px;
            background-color: #ffffff;
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Smooth expansion glow on focus */
        input:focus, textarea:focus {
            outline: none;
            border-color: #0f172a;
            box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.08);
        }

        textarea {
            resize: vertical;
        }

        /* ==========================================================================
           DATA GRIDS (Coverage, Company, Cheque)
           ========================================================================== */
        .grid-2x2, .grid-1x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .inline-field {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 4px 16px;
            transition: all 0.2s ease;
        }
        .inline-field:focus-within {
            border-color: #0f172a;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.08);
        }

        .inline-field label {
            margin-bottom: 0;
            margin-right: 12px;
            color: #94a3b8;
            font-weight: 700;
            font-size: 15px;
        }

        .inline-field input {
            border: none;
            background: transparent;
            padding: 12px 0;
            width: 100%;
        }
        .inline-field input:focus {
            box-shadow: none;
        }

        .transport-flex {
            display: flex;
            gap: 20px;
        }

        /* ==========================================================================
           EXECUTIVE SIGNATURE ZONE & ALERT NOTE
           ========================================================================== */
        .signature-section {
            display: flex;
            justify-content: space-between;
            margin-top: 70px;
            padding-top: 30px;
            border-top: 1px dashed #e2e8f0;
        }

        .sig-block {
            width: 44%;
        }

        .sig-line {
            border-top: 2px solid #0f172a;
            margin-bottom: 12px;
            height: 50px;
            position: relative;
        }
        .sig-line::before {
            content: "X";
            position: absolute;
            bottom: 4px;
            left: 8px;
            color: #cbd5e1;
            font-size: 18px;
            font-weight: 300;
        }

        .sig-block label {
            font-size: 12px;
            color: #0f172a;
            font-weight: 600;
        }

        .sig-subtext {
            font-size: 11px;
            color: #64748b;
            margin: 4px 0 0 0;
            font-weight: 500;
        }

        .date-row {
            display: flex;
            align-items: center;
            margin-top: 20px;
        }

        .date-row label {
            margin-bottom: 0;
            margin-right: 12px;
            color: #64748b;
        }

        .date-row input {
            max-width: 150px;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 8px;
        }

        /* Clean Elegant Notice Callout Box */
        .document-alert-note {
            background-color: #fff1f2;
            border: 1px solid #ffe4e6;
            border-left: 4px solid #f43f5e;
            padding: 18px 24px;
            margin-top: 50px;
            border-radius: 12px;
        }

        .document-alert-note p {
            margin: 0;
            color: #9f1239;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.2px;
        }
    </style>
</head>
